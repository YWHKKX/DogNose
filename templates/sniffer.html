<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DogNose - 抓包查看器</title>
	<style>
		:root {
			--bg: #0f1419;
			--panel: #1a2332;
			--border: #2d3a4f;
			--text: #e7ecf3;
			--muted: #8b9bb4;
			--accent: #3d8bfd;
			--http: #4ade80;
			--tls: #f59e0b;
			--dns: #a78bfa;
			--tcp: #60a5fa;
			--udp: #34d399;
			--icmp: #f472b6;
			--arp: #fb923c;
		}

		* { box-sizing: border-box; }

		body {
			font-family: "Segoe UI", "PingFang SC", sans-serif;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			height: 100vh;
			background: var(--bg);
			color: var(--text);
		}

		.toolbar {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
			padding: 10px 14px;
			background: var(--panel);
			border-bottom: 1px solid var(--border);
		}

		.toolbar .brand {
			font-weight: 700;
			margin-right: 8px;
			letter-spacing: 0.02em;
		}

		.btn {
			background: #243044;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
		}

		.btn:hover { border-color: var(--accent); }
		.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
		.btn.danger { background: #7f1d1d; border-color: #991b1b; }
		.btn.active { border-color: var(--accent); color: var(--accent); }

		.toolbar input[type="text"] {
			background: #0f1419;
			border: 1px solid var(--border);
			color: var(--text);
			border-radius: 6px;
			padding: 6px 10px;
			font-size: 13px;
		}

		#filter-input { width: 220px; }
		#search { width: 180px; }

		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			display: inline-block;
			margin-right: 6px;
			background: #ef4444;
		}
		.status-dot.on { background: #22c55e; }
		.status-dot.paused { background: #f59e0b; }

		.stats {
			margin-left: auto;
			font-size: 12px;
			color: var(--muted);
			display: flex;
			gap: 14px;
			flex-wrap: wrap;
		}

		.proto-bar {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			padding: 8px 14px;
			background: #121a24;
			border-bottom: 1px solid var(--border);
			align-items: center;
		}

		.chip {
			border: 1px solid var(--border);
			background: transparent;
			color: var(--muted);
			border-radius: 999px;
			padding: 3px 10px;
			font-size: 12px;
			cursor: pointer;
		}
		.chip.on {
			color: var(--text);
			border-color: var(--accent);
			background: rgba(61, 139, 253, 0.15);
		}

		.main {
			display: flex;
			flex: 1;
			min-height: 0;
		}

		#sidebar {
			width: 440px;
			border-right: 1px solid var(--border);
			overflow-y: auto;
			padding: 10px;
			background: #121a24;
		}

		#content {
			flex: 1;
			padding: 16px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			gap: 12px;
			min-width: 0;
		}

		.side-panels {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 10px 12px;
			font-size: 12px;
		}

		.panel h3 {
			margin: 0 0 8px;
			font-size: 13px;
			color: var(--muted);
			font-weight: 600;
		}

		.bar-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 4px;
		}
		.bar-label { width: 64px; color: var(--muted); }
		.bar-track {
			flex: 1;
			height: 6px;
			background: #0f1419;
			border-radius: 3px;
			overflow: hidden;
		}
		.bar-fill { height: 100%; background: var(--accent); }
		.bar-val { width: 40px; text-align: right; color: var(--text); }

		.talker-row {
			display: flex;
			justify-content: space-between;
			gap: 8px;
			padding: 2px 0;
			font-family: ui-monospace, Consolas, monospace;
		}

		.packet-item {
			padding: 8px 10px;
			margin-bottom: 4px;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 6px;
			cursor: pointer;
			font-size: 12px;
			font-family: ui-monospace, Consolas, monospace;
			display: flex;
			justify-content: space-between;
			gap: 8px;
		}

		.packet-item:hover { border-color: var(--accent); }
		.packet-item.active {
			background: #1e3a5f;
			border-color: var(--accent);
		}

		.packet-meta {
			display: flex;
			flex-direction: column;
			gap: 2px;
			min-width: 0;
		}
		.packet-meta .sum {
			color: var(--muted);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 280px;
		}

		.badge {
			font-size: 10px;
			padding: 2px 6px;
			border-radius: 4px;
			font-weight: 600;
			flex-shrink: 0;
			align-self: flex-start;
		}
		.badge.HTTP { background: rgba(74,222,128,.2); color: var(--http); }
		.badge.TLS { background: rgba(245,158,11,.2); color: var(--tls); }
		.badge.DNS { background: rgba(167,139,250,.2); color: var(--dns); }
		.badge.TCP { background: rgba(96,165,250,.2); color: var(--tcp); }
		.badge.UDP { background: rgba(52,211,153,.2); color: var(--udp); }
		.badge.ICMP, .badge.ICMPv6 { background: rgba(244,114,182,.2); color: var(--icmp); }
		.badge.ARP { background: rgba(251,146,60,.2); color: var(--arp); }
		.badge.IPv4, .badge.IPv6, .badge.Unknown {
			background: rgba(139,155,180,.2); color: var(--muted);
		}

		#packet-details {
			flex: 1;
			width: 100%;
			padding: 12px;
			border: 1px solid var(--border);
			border-radius: 8px;
			font-family: ui-monospace, Consolas, monospace;
			font-size: 12px;
			white-space: pre-wrap;
			overflow-y: auto;
			resize: none;
			background: #0b1017;
			color: #d6deeb;
			min-height: 200px;
		}

		h2 { margin: 0 0 10px; font-size: 16px; color: var(--text); }

		@media (max-width: 1100px) {
			.side-panels { grid-template-columns: 1fr; }
		}
		@media (max-width: 900px) {
			.main { flex-direction: column; }
			#sidebar { width: 100%; height: 40%; }
		}
	</style>
</head>

<body>
	<div class="toolbar">
		<span class="brand">DogNose</span>
		<span id="conn-label"><span class="status-dot" id="conn-dot"></span>未连接</span>
		<button class="btn" id="btn-pause">暂停</button>
		<button class="btn" id="btn-resume" style="display:none">继续</button>
		<button class="btn danger" id="btn-clear">清空</button>
		<input type="text" id="filter-input" placeholder="BPF 过滤器，如 tcp port 80">
		<button class="btn primary" id="btn-filter">应用过滤</button>
		<input type="text" id="search" placeholder="搜索 IP / 协议 / URI...">
		<button class="btn" id="btn-autoscroll">自动滚动:开</button>
		<button class="btn" id="btn-export">导出选中</button>
		<button class="btn" id="btn-export-all">导出缓冲</button>
		<button class="btn" id="btn-pcap">开始录制 PCAP</button>
		<div class="stats" id="stats">
			<span>包数: 0</span>
			<span>缓冲: 0</span>
			<span>流量: 0 B</span>
		</div>
	</div>

	<div class="proto-bar" id="proto-bar">
		<span style="color:var(--muted);font-size:12px">协议:</span>
	</div>

	<div class="main">
		<div id="sidebar">
			<h2>抓包列表 <span id="list-count" style="color:var(--muted);font-weight:400"></span></h2>
			<div id="packet-list"></div>
		</div>
		<div id="content">
			<div class="side-panels">
				<div class="panel">
					<h3>协议分布</h3>
					<div id="proto-stats"></div>
				</div>
				<div class="panel">
					<h3>Top Talkers</h3>
					<div id="talker-stats"></div>
				</div>
			</div>
			<h2>抓包详情</h2>
			<textarea id="packet-details" readonly placeholder="选择左侧数据包查看分层详情"></textarea>
		</div>
	</div>

	<script>
		const MAX_PACKETS = 2000;
		const PROTOCOLS = ['ALL', 'TCP', 'UDP', 'DNS', 'TLS', 'HTTP', 'ICMP', 'ICMPv6', 'ARP'];
		let allPackets = [];
		let searchTerm = '';
		let protoFilter = 'ALL';
		let selectedPacket = null;
		let paused = false;
		let autoScroll = true;
		let savingPcap = false;
		let socket = null;
		let renderScheduled = false;

		const listEl = document.getElementById('packet-list');
		const detailsEl = document.getElementById('packet-details');
		const searchEl = document.getElementById('search');
		const filterEl = document.getElementById('filter-input');
		const connDot = document.getElementById('conn-dot');
		const connLabel = document.getElementById('conn-label');
		const btnPause = document.getElementById('btn-pause');
		const btnResume = document.getElementById('btn-resume');
		const btnAutoscroll = document.getElementById('btn-autoscroll');
		const btnPcap = document.getElementById('btn-pcap');
		const protoBar = document.getElementById('proto-bar');

		PROTOCOLS.forEach(p => {
			const b = document.createElement('button');
			b.className = 'chip' + (p === 'ALL' ? ' on' : '');
			b.textContent = p;
			b.dataset.proto = p;
			b.onclick = () => {
				protoFilter = p;
				[...protoBar.querySelectorAll('.chip')].forEach(c => c.classList.toggle('on', c.dataset.proto === p));
				scheduleRender();
			};
			protoBar.appendChild(b);
		});

		function setConn(state) {
			connDot.className = 'status-dot' + (state === 'on' ? ' on' : state === 'paused' ? ' paused' : '');
			connLabel.lastChild.textContent = state === 'on' ? ' 实时抓包中' : state === 'paused' ? ' 已暂停' : ' 未连接';
		}

		function connect() {
			const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
			socket = new WebSocket(proto + location.host + '/packets');
			socket.onopen = () => { setConn(paused ? 'paused' : 'on'); refreshStats(); };
			socket.onclose = () => {
				setConn('off');
				setTimeout(connect, 2000);
			};
			socket.onmessage = (event) => {
				const data = JSON.parse(event.data);
				const packets = Array.isArray(data?.packets) ? data.packets : [];
				if (data.type === 'snapshot') {
					allPackets = packets.slice(-MAX_PACKETS);
				} else {
					allPackets = [...allPackets, ...packets].slice(-MAX_PACKETS);
				}
				scheduleRender();
			};
		}

		function scheduleRender() {
			if (renderScheduled) return;
			renderScheduled = true;
			requestAnimationFrame(() => {
				renderScheduled = false;
				renderPacketList();
			});
		}

		async function refreshStats() {
			try {
				const res = await fetch('/api/status');
				const s = await res.json();
				paused = !!s.paused;
				savingPcap = !!s.saving_pcap;
				btnPause.style.display = paused ? 'none' : '';
				btnResume.style.display = paused ? '' : 'none';
				btnPcap.textContent = savingPcap ? '停止录制 PCAP' : '开始录制 PCAP';
				btnPcap.classList.toggle('active', savingPcap);
				if (socket && socket.readyState === WebSocket.OPEN) {
					setConn(paused ? 'paused' : 'on');
				}
				if (s.filter && !filterEl.dataset.touched) {
					filterEl.value = s.filter.replace(/^\(|\)$/g, '');
				}
				document.getElementById('stats').innerHTML =
					`<span>包数: ${s.total_packets}</span>` +
					`<span>缓冲: ${s.buffered_count}/${s.buffer_capacity || '?'}</span>` +
					`<span>流量: ${formatBytes(s.bytes_captured)}</span>` +
					`<span>速率: ${(s.packets_per_sec || 0).toFixed(1)} pps</span>` +
					`<span>丢批: ${s.dropped_batches || 0}</span>` +
					`<span>客户端: ${s.clients}</span>`;
				renderProtoStats(s.protocol_counts || {});
				renderTalkers(s.top_talkers || []);
			} catch (_) {}
		}

		function renderProtoStats(counts) {
			const el = document.getElementById('proto-stats');
			const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
			if (!entries.length) {
				el.innerHTML = '<span style="color:var(--muted)">暂无数据</span>';
				return;
			}
			const max = entries[0][1] || 1;
			el.innerHTML = entries.map(([k, v]) => {
				const pct = Math.max(4, Math.round(v / max * 100));
				return `<div class="bar-row"><span class="bar-label">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${v}</span></div>`;
			}).join('');
		}

		function renderTalkers(list) {
			const el = document.getElementById('talker-stats');
			if (!list.length) {
				el.innerHTML = '<span style="color:var(--muted)">暂无数据</span>';
				return;
			}
			el.innerHTML = list.map(t =>
				`<div class="talker-row"><span>${t.ip}</span><span style="color:var(--muted)">${t.packets} pkts · ${formatBytes(t.bytes)}</span></div>`
			).join('');
		}

		function formatBytes(n) {
			n = Number(n) || 0;
			if (n < 1024) return n + ' B';
			if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
			return (n / 1048576).toFixed(1) + ' MB';
		}

		searchEl.addEventListener('input', () => {
			searchTerm = searchEl.value.toLowerCase();
			scheduleRender();
		});
		filterEl.addEventListener('input', () => { filterEl.dataset.touched = '1'; });

		btnPause.onclick = async () => {
			await fetch('/api/capture/pause', { method: 'POST' });
			refreshStats();
		};
		btnResume.onclick = async () => {
			await fetch('/api/capture/resume', { method: 'POST' });
			refreshStats();
		};
		document.getElementById('btn-clear').onclick = async () => {
			await fetch('/api/capture/clear', { method: 'POST' });
			allPackets = [];
			selectedPacket = null;
			detailsEl.value = '';
			scheduleRender();
			refreshStats();
		};
		document.getElementById('btn-filter').onclick = async () => {
			const filter = filterEl.value.trim();
			const res = await fetch('/api/filter', {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ filter })
			});
			if (!res.ok) {
				alert('过滤器无效: ' + await res.text());
				return;
			}
			refreshStats();
		};
		btnAutoscroll.onclick = () => {
			autoScroll = !autoScroll;
			btnAutoscroll.textContent = '自动滚动:' + (autoScroll ? '开' : '关');
			btnAutoscroll.classList.toggle('active', autoScroll);
		};
		document.getElementById('btn-export').onclick = () => {
			if (!selectedPacket) {
				alert('请先选择一个数据包');
				return;
			}
			downloadJSON(selectedPacket, `packet_${selectedPacket.frame_id}.json`);
		};
		document.getElementById('btn-export-all').onclick = () => {
			const q = protoFilter !== 'ALL' ? `?protocol=${encodeURIComponent(protoFilter)}` : '';
			window.location.href = '/api/packets/export' + q;
		};
		btnPcap.onclick = async () => {
			const url = savingPcap ? '/api/pcap/stop' : '/api/pcap/start';
			const res = await fetch(url, { method: 'POST' });
			if (!res.ok) {
				alert(await res.text());
				return;
			}
			refreshStats();
		};

		function downloadJSON(obj, name) {
			const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
			const a = document.createElement('a');
			a.href = URL.createObjectURL(blob);
			a.download = name;
			a.click();
			URL.revokeObjectURL(a.href);
		}

		function endpoint(packet) {
			const srcIP = packet.ipv6?.src_ip || packet.ipv4?.src_ip || packet.arp?.sender_ip || '?';
			const dstIP = packet.ipv6?.dst_ip || packet.ipv4?.dst_ip || packet.arp?.target_ip || '?';
			const srcPort = packet.udp?.src_port || packet.tcp?.src_port || '';
			const dstPort = packet.udp?.dst_port || packet.tcp?.dst_port || '';
			const left = srcPort ? `${srcIP}:${srcPort}` : srcIP;
			const right = dstPort ? `${dstIP}:${dstPort}` : dstIP;
			return `${left} → ${right}`;
		}

		function matchesSearch(packet) {
			if (protoFilter !== 'ALL' && packet.protocol !== protoFilter) return false;
			if (!searchTerm) return true;
			const fields = [
				packet.protocol, packet.summary,
				packet.ipv4?.src_ip, packet.ipv4?.dst_ip,
				packet.ipv6?.src_ip, packet.ipv6?.dst_ip,
				packet.arp?.sender_ip, packet.arp?.target_ip,
				packet.http?.method, packet.http?.uri, packet.http?.status_code,
				packet.tls?.sni, packet.tls?.handshake,
				packet.icmp?.type_code,
				...(packet.dns?.questions || []),
				...(packet.dns?.answers || []),
				packet.tcp?.flags
			];
			return fields.some(v => String(v || '').toLowerCase().includes(searchTerm));
		}

		function renderPacketList() {
			const packets = allPackets.filter(matchesSearch);
			document.getElementById('list-count').textContent = `(${packets.length})`;
			listEl.innerHTML = '';
			const frag = document.createDocumentFragment();
			const start = Math.max(0, packets.length - 300);
			for (let i = start; i < packets.length; i++) {
				const packet = packets[i];
				const item = document.createElement('div');
				item.className = 'packet-item' + (selectedPacket === packet ? ' active' : '');
				const proto = packet.protocol || 'Unknown';
				const sum = packet.summary || endpoint(packet);
				item.innerHTML =
					`<div class="packet-meta"><span>#${packet.frame_id} ${endpoint(packet)}</span><span class="sum">${escapeHtml(sum)}</span></div>` +
					`<span class="badge ${proto}">${proto}</span>`;
				item.onclick = () => {
					selectedPacket = packet;
					showPacketDetails(packet);
					scheduleRender();
				};
				frag.appendChild(item);
			}
			listEl.appendChild(frag);
			if (autoScroll) listEl.scrollTop = listEl.scrollHeight;
		}

		function escapeHtml(s) {
			return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
		}

		function showPacketDetails(packet) {
			let details = `Packet Timestamp: ${packet.capture_time}\n`;
			details += `Frame ${packet.frame_id}: ${packet.wire_bytes} bytes on wire, `;
			details += `${packet.captured_bytes} bytes captured on interface ${packet.interface}\n`;
			details += `Protocol: ${packet.protocol}\n`;
			if (packet.summary) details += `Summary: ${packet.summary}\n`;
			details += '\n';

			if (packet.ethernet?.src_mac) {
				details += `Ethernet II, Src: ${packet.ethernet.src_mac}, Dst: ${packet.ethernet.dst_mac}\n`;
				details += `    Type: ${packet.ethernet.ether_type}\n\n`;
			}
			if (packet.arp?.operation) {
				details += `ARP ${packet.arp.operation}\n`;
				details += `    Sender: ${packet.arp.sender_mac} (${packet.arp.sender_ip})\n`;
				details += `    Target: ${packet.arp.target_mac} (${packet.arp.target_ip})\n\n`;
			}
			if (packet.ipv6?.src_ip || packet.ipv6?.dst_ip) {
				details += `IPv6, Src: ${packet.ipv6.src_ip}, Dst: ${packet.ipv6.dst_ip}\n`;
				if (packet.ipv6.next_header) details += `    Next Header: ${packet.ipv6.next_header}\n`;
				if (packet.ipv6.hop_limit) details += `    Hop Limit: ${packet.ipv6.hop_limit}\n`;
				details += '\n';
			}
			if (packet.ipv4?.src_ip || packet.ipv4?.dst_ip) {
				details += `IPv4, Src: ${packet.ipv4.src_ip}, Dst: ${packet.ipv4.dst_ip}\n`;
				if (packet.ipv4.ttl) details += `    TTL: ${packet.ipv4.ttl}\n`;
				if (packet.ipv4.id) details += `    Identification: ${packet.ipv4.id}\n`;
				if (packet.ipv4.flags) details += `    Flags: ${packet.ipv4.flags}\n`;
				if (packet.ipv4.protocol) details += `    Protocol: ${packet.ipv4.protocol}\n`;
				details += '\n';
			}
			if (packet.icmp?.type_code) {
				details += `ICMP v${packet.icmp.version || '?'}: ${packet.icmp.type_code}\n`;
				if (packet.icmp.id) details += `    ID: ${packet.icmp.id}, Seq: ${packet.icmp.seq}\n`;
				details += '\n';
			}
			if (packet.udp?.src_port || packet.udp?.dst_port) {
				details += `UDP, Src Port: ${packet.udp.src_port}, Dst Port: ${packet.udp.dst_port}, Len: ${packet.udp.data_len}\n\n`;
			}
			if (packet.tcp?.src_port || packet.tcp?.dst_port) {
				details += `TCP, Src Port: ${packet.tcp.src_port}, Dst Port: ${packet.tcp.dst_port}\n`;
				details += `    Seq: ${packet.tcp.seq}, Ack: ${packet.tcp.ack}, Len: ${packet.tcp.data_len}\n`;
				if (packet.tcp.flags) details += `    Flags: ${packet.tcp.flags}\n`;
				if (packet.tcp.window) details += `    Window: ${packet.tcp.window}\n`;
				details += '\n';
			}
			if (packet.dns && (packet.dns.questions?.length || packet.dns.answers?.length || packet.dns.id)) {
				details += `DNS ID=${packet.dns.id} ${packet.dns.qr ? 'Response' : 'Query'} Opcode=${packet.dns.opcode || ''}\n`;
				(packet.dns.questions || []).forEach(q => { details += `    Q: ${q}\n`; });
				(packet.dns.answers || []).forEach(a => { details += `    A: ${a}\n`; });
				details += '\n';
			}
			if (packet.tls?.content_type) {
				details += `TLS ${packet.tls.version || ''}\n`;
				details += `    ContentType: ${packet.tls.content_type}\n`;
				if (packet.tls.handshake) details += `    Handshake: ${packet.tls.handshake}\n`;
				if (packet.tls.sni) details += `    SNI: ${packet.tls.sni}\n`;
				details += '\n';
			}
			if (packet.http?.method || packet.http?.is_response) {
				details += `HTTP\n`;
				if (packet.http.is_response) {
					details += `    ${packet.http.version || 'HTTP/1.1'} ${packet.http.status_code} ${packet.http.status_text || ''}\n`;
				} else {
					details += `    ${packet.http.method} ${packet.http.uri} ${packet.http.version || ''}\n`;
				}
				for (const [k, v] of Object.entries(packet.http.headers || {})) {
					details += `    ${k}: ${v}\n`;
				}
				details += '\n';
			}
			if (packet.raw_data && packet.raw_data.length > 0) {
				const rawBytes = decodeRawData(packet.raw_data);
				details += formatHexDump(rawBytes, 256);
			}
			detailsEl.value = details;
		}

		function formatHexDump(bytes, maxLen) {
			const slice = bytes.slice(0, maxLen);
			let out = `Data (${bytes.length} bytes` + (bytes.length > maxLen ? `, showing ${maxLen}` : '') + `)\n`;
			for (let i = 0; i < slice.length; i += 16) {
				const chunk = slice.slice(i, i + 16);
				const hex = Array.from(chunk, b => b.toString(16).padStart(2, '0')).join(' ').padEnd(47, ' ');
				const ascii = Array.from(chunk, b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
				out += `    ${i.toString(16).padStart(4, '0')}  ${hex}  |${ascii}|\n`;
			}
			return out;
		}

		function decodeRawData(rawData) {
			if (Array.isArray(rawData)) return rawData;
			if (typeof rawData === 'string') {
				try {
					return Array.from(atob(rawData), c => c.charCodeAt(0));
				} catch (_) { return []; }
			}
			return [];
		}

		connect();
		refreshStats();
		setInterval(refreshStats, 2000);
	</script>
</body>
