<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DogNose - 网络嗅探器</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
	<!-- 导航栏 -->
	<nav class="navbar">
		<div class="logo">DogNose</div>
		<ul class="nav-links">
			<li><a href="/">首页</a></li>
			<li><a href="/sniffer">嗅探器</a></li>
		</ul>
	</nav>

	<!-- 主要内容区 -->
	<div class="container">
		<!-- 英雄区域 -->
		<section class="hero">
			<h1>DogNose 网络嗅探器</h1>
			<p>基于 Go + gopacket 的轻量级抓包工具，支持 DNS / TLS / HTTP 解析与实时控制</p>
			<a href="/sniffer" class="btn">启动嗅探器</a>
		</section>

		<!-- 特性卡片 -->
		<div class="features">
			<div class="card" onclick="window.location.href='/sniffer'">
				<h3>启动嗅探器</h3>
				<p>实时查看网络抓包数据，支持协议分层展示</p>
			</div>
			<div class="card" onclick="window.location.href='/api/devices'">
				<h3>查看网卡列表</h3>
				<p>查看当前系统可用的网络接口</p>
			</div>
		</div>
	</div>

	<!-- 页脚 -->
	<footer>
		<p>&copy; 2025 DogNose. All rights reserved.</p>
	</footer>

	<script src="assets/js/script.js"></script>
</body>

</html>
